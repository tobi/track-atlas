name: pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tracks.jsonl'
      - 'tracks/**/*.json'
      - 'tracks/**/*.geojson'
      - 'schema/*.json'
      - 'scripts/build_site.py'
      - 'README.md'
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build site
        run: uv run --no-project python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
