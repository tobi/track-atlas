name: pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tracks.jsonl'
      - 'tracks/**/*.json'
      - 'tracks/**/*.geojson'
      - 'schema/*.json'
      - 'scripts/build_site.py'
      - 'scripts/sim/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
      - 'README.md'
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check:sim && bun run test:sim
      - name: Build site
        run: uv run --no-project python scripts/build_site.py
      - name: Build browser simulator
        run: bun run build:sim
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
